<title>Roster Fit Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: a scorer's-table workbench. Top bar with the three tools; each tool is the square (left)
   and its numbers (right), stacking to one column on phones. Gym-wall neutrals, ball-orange accent
   used only for selection and actions; player colors are the validated chart palette. */
:root {
  --bg: #eef1ed;
  --surface: #ffffff;
  --surface-2: #f6f8f5;
  --ink: #14211b;
  --ink-2: #4b5953;
  --muted: #76847e;
  --line: #d6ddd9;
  --grid: #e2e8e4;
  --axis: #bcc6c1;
  --accent: #c2410c;
  --accent-soft: #fbe5d8;
  --on-accent: #ffffff;
  --other: #8b9690;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1512; --surface: #151f1b; --surface-2: #1a2520; --ink: #e6eee9; --ink-2: #b2c0b9;
    --muted: #84928c; --line: #29352f; --grid: #222e28; --axis: #3a4842; --accent: #fb8a4c;
    --accent-soft: #3b251a; --on-accent: #1a0e07; --other: #7f8b86;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1512; --surface: #151f1b; --surface-2: #1a2520; --ink: #e6eee9; --ink-2: #b2c0b9;
  --muted: #84928c; --line: #29352f; --grid: #222e28; --axis: #3a4842; --accent: #fb8a4c;
  --accent-soft: #3b251a; --on-accent: #1a0e07; --other: #7f8b86;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.app { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 0 32px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding-block: 18px 14px;
  border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 30px; height: 30px; }
.brand h1 { font-size: 28px; line-height: 1; }
.brand small { display: block; font: 500 12px var(--font-body); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-top: 3px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px 6px; cursor: pointer;
  font: 600 18px var(--font-display); letter-spacing: .03em; color: var(--ink-2); }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
@media (max-width: 480px) { .top { gap: 8px 20px; } .tabs { flex-wrap: nowrap; gap: 0; } .tab { padding: 6px 8px 5px; font-size: 16.5px; white-space: nowrap; } }
.notice { margin-top: 12px; padding: 8px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--ink); font-size: 14px; }

/* controls */
.view { padding-top: 18px; }
.controls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; margin-bottom: 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span, .pick legend { font: 600 12px var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field.grow { flex: 1 1 220px; }
select, input[type="search"] { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg-btn { border: 0; background: none; padding: 8px 12px; cursor: pointer; color: var(--ink-2); }
.seg-btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg-btn:disabled { opacity: .45; cursor: not-allowed; }
.check { display: inline-flex; align-items: center; gap: 6px; padding-bottom: 8px; color: var(--ink-2); cursor: pointer; }
.check input { accent-color: var(--accent); }
.pick { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px 12px; display: flex; flex-wrap: wrap; gap: 8px; margin: 0; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }

/* chart + panel */
.split { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); gap: 20px; align-items: start; }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 880px) { .split, .duo { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 14px 10px; min-width: 0; }
.chart-title { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 4px; }
.chart-title h2 { font-size: 24px; }
.chart-title span { color: var(--muted); font-size: 13px; }
svg.square { display: block; width: 100%; height: auto; max-width: 620px; margin-inline: auto; touch-action: manipulation; }
.hint { margin: 4px 0 0; min-height: 1.45em; font-size: 13px; color: var(--ink-2); text-align: center; }

.ring, .diag { fill: none; stroke: var(--grid); stroke-width: 1; vector-effect: non-scaling-stroke; }
.frame { fill: none; stroke: var(--axis); stroke-width: 1.25; vector-effect: non-scaling-stroke; }
.tick { font: 500 22px var(--font-body); fill: var(--muted); }
.corner-head { font: 700 44px var(--font-display); letter-spacing: .02em; fill: var(--ink); }
.corner-sub { font: 400 23px var(--font-body); fill: var(--ink-2); }
.shape { fill: var(--c); fill-opacity: .16; stroke: var(--c); stroke-width: 2; stroke-linejoin: round; vector-effect: non-scaling-stroke; transition: opacity .15s, fill-opacity .15s; cursor: pointer; }
.shape.other { --c: var(--other); fill-opacity: .07; stroke-width: 1; stroke-opacity: .65; }
.outline { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linejoin: round; vector-effect: non-scaling-stroke; pointer-events: none; }
.label { transition: opacity .15s; pointer-events: none; }
.label .leader { stroke: var(--ink-2); stroke-width: .8; vector-effect: non-scaling-stroke; }
.label .dot { fill: var(--c); stroke: var(--surface); stroke-width: 2; vector-effect: non-scaling-stroke; }
.label .name { font: 500 29px var(--font-body); fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 7px; stroke-linejoin: round; }
.c1 { --c: var(--s1); } .c2 { --c: var(--s2); } .c3 { --c: var(--s3); } .c4 { --c: var(--s4); }
.c5 { --c: var(--s5); } .c6 { --c: var(--s6); } .c7 { --c: var(--s7); } .c8 { --c: var(--s8); }
.has-focus .shape:not(.is-focus) { opacity: .15; }
.has-focus .label:not(.is-focus) { opacity: .2; }
.shape.is-focus { fill-opacity: .32; stroke-width: 3; }
@media (prefers-reduced-motion: reduce) { .shape, .label { transition: none; } }

/* numbers */
.panel { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.stats { display: grid; grid-template-columns: 1.35fr 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .stats { grid-template-columns: 1fr 1fr; } .stat.hero { grid-column: 1 / -1; } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; min-width: 0; }
.stat-label { font: 600 12px var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stat-value { font: 700 34px/1.05 var(--font-display); margin-top: 2px; }
.stat.hero .stat-value { font-size: 56px; }
.stat-note { font-size: 12.5px; color: var(--ink-2); }
.surplus { margin: 0; font-size: 14px; color: var(--ink); }
.surplus .k { color: var(--muted); font: 600 12px var(--font-body); letter-spacing: .06em; text-transform: uppercase; margin-right: 6px; }
.surplus .unit { color: var(--muted); }
.sub { font-size: 18px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.sub small { font: 400 13px var(--font-body); color: var(--muted); }
.bars { display: grid; gap: 7px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 9.5em) minmax(0, 1fr) 2.6em; align-items: center; gap: 10px; }
.bar-track { height: 10px; background: var(--grid); border-radius: 5px; overflow: hidden; }
.bar-fill { display: block; height: 100%; background: var(--ink); border-radius: 5px; }
.bar-val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 6px 10px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
thead th { font: 600 11.5px var(--font-body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
tbody tr { border-top: 1px solid var(--grid); cursor: default; }
tbody tr.is-focus { background: var(--surface-2); }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--other)); margin-right: 8px; vertical-align: 0; }
td.dim { color: var(--muted); }
@media (max-width: 480px) { table { font-size: 13px; } th, td { padding: 6px 4px; } thead th { font-size: 10.5px; letter-spacing: .02em; } .swatch { margin-right: 5px; } }

/* compare */
.versus { margin-top: 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; }
@media (max-width: 880px) { .versus { grid-template-columns: minmax(0, 1fr); } }
.versus table td.lead { font-weight: 700; }
.dumbbells { display: grid; gap: 12px; }
.dumb-head { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.dumb-head b { font-weight: 600; }
.dumb-track { position: relative; height: 14px; margin-top: 4px; }
.dumb-track::before { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 2px; background: var(--grid); }
.dumb-span { position: absolute; top: 5px; height: 4px; background: var(--ink-2); border-radius: 2px; }
.dumb-dot { position: absolute; top: 0; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; border: 2px solid var(--ink); background: var(--ink); }
.dumb-dot.b { background: var(--surface); }
.legend-ab { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); }
.legend-ab i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--ink); margin-right: 5px; vertical-align: -1px; }
.legend-ab i.a { background: var(--ink); }

/* builder */
.builder-side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.slots { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.slot { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.slot.empty { border-style: dashed; color: var(--muted); background: transparent; }
.slot .who { min-width: 0; }
.slot .who b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .who span { font-size: 12.5px; color: var(--muted); }
.slot .x { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px 6px; border-radius: 6px; }
.slot .x:hover { color: var(--ink); background: var(--surface-2); }
.results { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 320px; overflow-y: auto; }
.result { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; border: 1px solid transparent; }
.result:hover { border-color: var(--line); background: var(--surface); }
.result .meta { font-size: 12.5px; color: var(--muted); }
.result .pcts { font-variant-numeric: tabular-nums; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.muted { color: var(--muted); }

/* footer */
.foot { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); display: grid; gap: 10px; font-size: 13.5px; color: var(--ink-2); }
.foot details { max-width: 72ch; }
.foot summary { cursor: pointer; font-weight: 600; color: var(--ink); }
.foot dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 10px 0 0; }
.foot dt { font-weight: 600; color: var(--ink); }
.foot dd { margin: 0; }
.foot a { color: inherit; }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="-12 -12 24 24" aria-hidden="true"><rect x="-10" y="-10" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"/><polygon points="-8,-7 6,-9 5,6 -6,8" fill="var(--accent)" fill-opacity=".35" stroke="var(--accent)" stroke-width="1.4"/></svg>
      <div><h1>Roster Fit Lab</h1><small id="brand-sub">Seasons</small></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Tools">
      <button class="tab" role="tab" id="tab-teams" aria-controls="view-teams" aria-selected="true">Teams</button>
      <button class="tab" role="tab" id="tab-compare" aria-controls="view-compare" aria-selected="false">Compare</button>
      <button class="tab" role="tab" id="tab-builder" aria-controls="view-builder" aria-selected="false">Lineup builder</button>
    </nav>
  </header>
  <p class="notice" id="synthetic-notice" hidden>Preview with a made-up league: the teams, names and numbers aren't real.</p>

  <section class="view" id="view-teams" role="tabpanel" aria-labelledby="tab-teams">
    <div class="controls">
      <label class="field"><span>Season</span><select id="teams-season"></select></label>
      <label class="field grow"><span>Team</span><select id="teams-team"></select></label>
      <div class="field"><span>Rotation</span>
        <div class="seg" role="group" aria-label="Rotation">
          <button class="seg-btn" id="teams-mode-regular" aria-pressed="true">Regular season</button>
          <button class="seg-btn" id="teams-mode-playoffs" aria-pressed="false">Playoff top 8</button>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="teams-outline" checked> Depth outline</label>
    </div>
    <div class="split">
      <figure class="card" style="margin:0">
        <div class="chart-title"><h2 id="teams-title"></h2><span id="teams-caption"></span></div>
        <svg class="square" id="teams-svg" role="img"></svg>
        <p class="hint" id="teams-hint">Hover a shape or a row to pick out one player.</p>
      </figure>
      <div class="panel" id="teams-panel"></div>
    </div>
  </section>

  <section class="view" id="view-compare" role="tabpanel" aria-labelledby="tab-compare" hidden>
    <div class="controls">
      <fieldset class="pick"><legend>Team A</legend>
        <select id="compare-a-season" aria-label="Team A season"></select>
        <select id="compare-a-team" aria-label="Team A"></select>
      </fieldset>
      <fieldset class="pick"><legend>Team B</legend>
        <select id="compare-b-season" aria-label="Team B season"></select>
        <select id="compare-b-team" aria-label="Team B"></select>
      </fieldset>
      <div class="field"><span>Rotation</span>
        <div class="seg" role="group" aria-label="Rotation">
          <button class="seg-btn" id="compare-mode-regular" aria-pressed="true">Regular season</button>
          <button class="seg-btn" id="compare-mode-playoffs" aria-pressed="false">Playoff top 8</button>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="compare-outline" checked> Depth outlines</label>
    </div>
    <div class="duo">
      <figure class="card" style="margin:0">
        <div class="chart-title"><h2 id="compare-a-title"></h2><span id="compare-a-caption"></span></div>
        <svg class="square" id="compare-a-svg" role="img"></svg>
      </figure>
      <figure class="card" style="margin:0">
        <div class="chart-title"><h2 id="compare-b-title"></h2><span id="compare-b-caption"></span></div>
        <svg class="square" id="compare-b-svg" role="img"></svg>
      </figure>
    </div>
    <div class="versus" id="compare-versus"></div>
  </section>

  <section class="view" id="view-builder" role="tabpanel" aria-labelledby="tab-builder" hidden>
    <div class="split">
      <div class="builder-side">
        <div>
          <h2 style="font-size:24px">Your lineup</h2>
          <p class="muted" style="margin:2px 0 8px">Five starters playing equal minutes. Mix players from any season; an empty spot counts as an average player.</p>
          <ol class="slots" id="builder-slots"></ol>
        </div>
        <label class="field"><span>Add a player</span>
          <input type="search" id="builder-search" placeholder="Search a name, e.g. Brunson" autocomplete="off" spellcheck="false">
        </label>
        <ul class="results" id="builder-results" aria-live="polite"></ul>
        <div class="row">
          <label class="field"><span>Start from a team</span><select id="builder-season" aria-label="Season"></select></label>
          <label class="field grow"><span>&nbsp;</span><select id="builder-team" aria-label="Team"></select></label>
          <button class="btn" id="builder-load">Use their top 5</button>
          <button class="btn" id="builder-clear">Clear</button>
        </div>
      </div>
      <div class="panel">
        <figure class="card" style="margin:0">
          <div class="chart-title"><h2>Your square</h2><span id="builder-caption"></span></div>
          <svg class="square" id="builder-svg" role="img"></svg>
          <p class="hint" id="builder-hint">Hover a shape or a row to pick out one player.</p>
        </figure>
        <div id="builder-panel" class="panel"></div>
      </div>
    </div>
  </section>

  <footer class="foot">
    <details>
      <summary>How to read the square</summary>
      <dl id="glossary"></dl>
    </details>
    <p id="sources"></p>
  </footer>
</div>

<script type="application/json" id="rf-data">/*__ROSTERFIT_DATA__*/</script>
<script>/*__ROSTERFIT_CORE__*/</script>
<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("rf-data").textContent);
  const RF = window.RosterFitCore;
  const M = DATA.meta;
  const INDEX = RF.playerIndex(DATA);
  const SEASONS = M.seasons.slice();
  const LATEST = SEASONS[SEASONS.length - 1];
  const ORDER = M.order;
  const CIDX = Object.fromEntries(M.corners.map((c, i) => [c, i]));
  const NS = "http://www.w3.org/2000/svg";
  const S = 500;  // drawing scale: the square spans -S..S in SVG units
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
  const fmtPct = (v) => (v == null ? "–" : String(Math.round(v)));
  const share = (v) => `${Math.round(v * 100)}%`;
  const mins = (v) => Math.round(v).toLocaleString("en-US");
  const short = (c) => (M.labels[c].length > 9 ? M.labels[c].split(" ")[0] : M.labels[c]);
  const yy = (s) => `${s.slice(2, 4)}-${s.slice(5)}`;
  const norm = (s) => String(s).normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  const keyOf = (p) => `${p.pid}|${p.season}`;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } },
  };

  const teamsIn = (season) => Object.entries(DATA.teams[season] || {})
    .map(([abbr, t]) => ({ abbr, name: t.name })).sort((a, b) => a.name.localeCompare(b.name));
  const hasPlayoffs = (season, abbr) => !!(DATA.teams[season] && DATA.teams[season][abbr] && DATA.teams[season][abbr].playoffs.length);
  const colorOrder = (season, abbr) => (DATA.teams[season][abbr].regular || []).map(([pid]) => `${pid}|${season}`);
  const poolSize = (mode) => M.pool_sizes[mode];

  function fillSelect(sel, items, value) {
    sel.replaceChildren(...items.map(([v, label]) => new Option(label, v)));
    if (value != null && items.some(([v]) => v === value)) sel.value = value;
  }
  const seasonItems = () => SEASONS.slice().reverse().map((s) => [s, s]);
  const teamItems = (season) => teamsIn(season).map((t) => [t.abbr, t.name === t.abbr ? t.abbr : `${t.name} (${t.abbr})`]);
  function defaultTeam(season, prefer) {
    const list = teamsIn(season).map((t) => t.abbr);
    for (const p of prefer) if (list.includes(p)) return p;
    return list[0];
  }

  /* ---- the square ---------------------------------------------------------------------- */
  function node(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
    if (parent) parent.appendChild(e);
    return e;
  }
  const pts = (list) => list.map(([x, y]) => `${(x * S).toFixed(1)},${(-y * S).toFixed(1)}`).join(" ");

  function colorsFor(res, order) {
    const drawn = res.players.filter((p) => p.drawn).sort((a, b) => b.min - a.min);
    const colored = drawn.slice(0, M.max_colored);
    const slots = RF.assignColors(colored.map(keyOf), order, 8);
    return { colored, others: drawn.slice(M.max_colored), slots };
  }

  function drawSquare(svg, res, opts) {
    svg.replaceChildren();
    svg.setAttribute("viewBox", `${-1.36 * S} ${-1.32 * S} ${2.72 * S} ${2.64 * S}`);
    for (const p of [0.25, 0.5, 0.75]) node("polygon", { class: "ring", points: pts(RF.CORNER_XY.map(([x, y]) => [x * p, y * p])) }, svg);
    for (const [x, y] of RF.CORNER_XY) node("line", { class: "diag", x1: 0, y1: 0, x2: x * S, y2: -y * S }, svg);
    node("polygon", { class: "frame", points: pts(RF.CORNER_XY) }, svg);
    for (const p of [0.25, 0.5, 0.75]) {
      node("text", { class: "tick", x: 0, y: ((-p + 0.06) * S).toFixed(1), "text-anchor": "middle" }, svg).textContent = String(p * 100);
    }
    ORDER.forEach((c, i) => {
      const [x, y] = RF.CORNER_XY[i];
      const anchor = x < 0 ? "start" : "end";
      node("text", { class: "corner-head", x: x * S, y: (y > 0 ? -1.13 : 1.115) * S, "text-anchor": anchor }, svg).textContent = M.labels[c];
      node("text", { class: "corner-sub", x: x * S, y: (y > 0 ? -1.055 : 1.19) * S, "text-anchor": anchor }, svg).textContent = M.descriptions[c];
    });
    const { colored, others, slots } = opts.colors;
    const g = node("g", { class: "shapes" }, svg);
    for (const p of others) node("polygon", { class: "shape other", points: pts(p.points), "data-key": keyOf(p) }, g);
    for (const p of colored.slice().reverse()) {
      node("polygon", { class: `shape c${slots.get(keyOf(p)) + 1}`, points: pts(p.points), "data-key": keyOf(p) }, g);
    }
    if (opts.outline) {
      const vals = ORDER.map((c) => (res.pct[c] == null ? 0 : res.pct[c] / 100));
      node("polygon", { class: "outline", points: pts(RF.shapePoints(vals, 1)) }, svg);
    }
    const cands = colored.map((p) => {
      const tip = p.points.reduce((a, b) => (Math.hypot(b[0], b[1]) > Math.hypot(a[0], a[1]) ? b : a));
      return { name: opts.labelOf ? opts.labelOf(p) : p.name, x: tip[0], y: tip[1], p };
    });
    const placed = RF.placeLabels(cands, 0.029, 0.072, 0.03);
    const lg = node("g", { class: "labels" }, svg);
    placed.forEach((L, i) => {
      const p = cands[i].p;
      const grp = node("g", { class: `label c${slots.get(keyOf(p)) + 1}`, "data-key": keyOf(p) }, lg);
      node("line", { class: "leader", x1: L.x * S, y1: -L.y * S, x2: L.lx * S, y2: -L.ly * S }, grp);
      node("circle", { class: "dot", cx: L.x * S, cy: -L.y * S, r: 11 }, grp);
      node("text", { class: "name", x: L.lx * S, y: -L.ly * S, "text-anchor": L.ha, "dominant-baseline": "central" }, grp).textContent = L.name;
    });
    const top = colored.slice(0, 3).map((p) => p.name).join(", ");
    svg.setAttribute("aria-label", `Coverage ${share(res.coverage)}, depth ${share(res.depth)}. Largest shapes: ${top}.`);
  }

  /* ---- focus: hover a shape or a row ---------------------------------------------------- */
  function bindFocus(svg, table, hint, describe) {
    const original = hint.textContent;
    const set = (key) => {
      svg.classList.toggle("has-focus", !!key);
      svg.querySelectorAll("[data-key]").forEach((n) => n.classList.toggle("is-focus", n.dataset.key === key));
      if (table) table.querySelectorAll("tr[data-key]").forEach((n) => n.classList.toggle("is-focus", n.dataset.key === key));
      hint.textContent = key ? describe(key) : original;
    };
    svg.onpointerover = (e) => { const n = e.target.closest("[data-key]"); set(n ? n.dataset.key : null); };
    svg.onpointerleave = () => set(null);
    if (table) {
      table.onpointerover = (e) => { const n = e.target.closest("tr[data-key]"); set(n ? n.dataset.key : null); };
      table.onpointerleave = () => set(null);
    }
  }
  function describePlayer(p) {
    const corners = ORDER.map((c) => `${M.labels[c]} ${fmtPct(p.pct[CIDX[c]])}`).join(" · ");
    return `${p.name}: ${corners}`;
  }

  /* ---- numbers ---------------------------------------------------------------------------- */
  function statsHTML(res, mode, outlineNote) {
    const red = M.capped.map((c) => `${esc(M.labels[c])} +${(res.redundancyPlayers[c] || 0).toFixed(1)}`).join(" · ");
    const bars = ORDER.map((c) => `
      <div class="bar-row"><span>${esc(M.labels[c])}</span>
        <span class="bar-track"><span class="bar-fill" style="width:${(res.pct[c] || 0).toFixed(1)}%"></span></span>
        <span class="bar-val">${fmtPct(res.pct[c])}</span></div>`).join("");
    return `
      <div class="stats">
        <div class="stat hero"><span class="stat-label">Coverage</span><span class="stat-value">${share(res.coverage)}</span>
          <span class="stat-note">of the square filled by the players' shapes</span></div>
        <div class="stat"><span class="stat-label">Depth</span><span class="stat-value">${share(res.depth)}</span>
          <span class="stat-note">${outlineNote}</span></div>
        <div class="stat"><span class="stat-label">Overlap</span><span class="stat-value">${res.overlap.toFixed(2)}</span>
          <span class="stat-note">squares of shape area shared</span></div>
      </div>
      <p class="surplus"><span class="k">Surplus above cap</span>${red} <span class="unit">players' worth</span></p>
      <div><h3 class="sub">Depth by corner <small>team percentile vs ${poolSize(mode)} team-seasons</small></h3>
        <div class="bars" style="margin-top:8px">${bars}</div></div>`;
  }

  function tableHTML(res, colors, opts) {
    const rows = res.players.filter((p) => p.drawn).sort((a, b) => b.min - a.min);
    const head = `<tr><th scope="col">Player</th><th scope="col">${opts.second}</th>${ORDER.map((c) => `<th scope="col">${esc(short(c))}</th>`).join("")}</tr>`;
    const body = rows.map((p) => {
      const slot = colors.slots.get(keyOf(p));
      const sw = slot == null ? `<span class="swatch"></span>` : `<span class="swatch c${slot + 1}" style="background:var(--c)"></span>`;
      return `<tr data-key="${esc(keyOf(p))}"><td>${sw}${esc(p.name)}</td><td>${opts.secondValue(p)}</td>${ORDER.map((c) => `<td>${fmtPct(p.pct[CIDX[c]])}</td>`).join("")}</tr>`;
    }).join("");
    return `<div class="table-wrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
  }

  /* ---- Teams ------------------------------------------------------------------------------ */
  const T = { season: LATEST, team: null, mode: "regular" };
  function renderTeams() {
    fillSelect($("teams-season"), seasonItems(), T.season);
    fillSelect($("teams-team"), teamItems(T.season), T.team);
    T.team = $("teams-team").value;
    const po = hasPlayoffs(T.season, T.team);
    $("teams-mode-playoffs").disabled = !po;
    if (!po && T.mode === "playoffs") T.mode = "regular";
    $("teams-mode-regular").setAttribute("aria-pressed", String(T.mode === "regular"));
    $("teams-mode-playoffs").setAttribute("aria-pressed", String(T.mode === "playoffs"));
    const res = RF.evaluateTeam(DATA, INDEX, T.season, T.team, T.mode);
    const colors = colorsFor(res, colorOrder(T.season, T.team));
    const name = DATA.teams[T.season][T.team].name;
    $("teams-title").textContent = name;
    $("teams-caption").textContent = `${T.season} · ${T.mode === "playoffs" ? `playoff top ${M.rotation_size}` : "regular season"} · shape area ∝ minutes`;
    drawSquare($("teams-svg"), res, { colors, outline: $("teams-outline").checked });
    $("teams-panel").innerHTML = statsHTML(res, T.mode, "inside the team outline: whole rotation")
      + tableHTML(res, colors, { second: "Min", secondValue: (p) => mins(p.min) });
    const byKey = new Map(res.players.map((p) => [keyOf(p), p]));
    bindFocus($("teams-svg"), $("teams-panel"), $("teams-hint"), (k) => describePlayer(byKey.get(k)));
    store.set("rf-teams", JSON.stringify(T));
  }

  /* ---- Compare ---------------------------------------------------------------------------- */
  const C = { a: { season: LATEST, team: null }, b: { season: LATEST, team: null }, mode: "regular" };
  function renderCompare() {
    for (const side of ["a", "b"]) {
      const st = C[side];
      fillSelect($(`compare-${side}-season`), seasonItems(), st.season);
      fillSelect($(`compare-${side}-team`), teamItems(st.season), st.team);
      st.team = $(`compare-${side}-team`).value;
    }
    const po = hasPlayoffs(C.a.season, C.a.team) && hasPlayoffs(C.b.season, C.b.team);
    $("compare-mode-playoffs").disabled = !po;
    if (!po && C.mode === "playoffs") C.mode = "regular";
    $("compare-mode-regular").setAttribute("aria-pressed", String(C.mode === "regular"));
    $("compare-mode-playoffs").setAttribute("aria-pressed", String(C.mode === "playoffs"));
    const out = {};
    for (const side of ["a", "b"]) {
      const st = C[side];
      const res = RF.evaluateTeam(DATA, INDEX, st.season, st.team, C.mode);
      const colors = colorsFor(res, colorOrder(st.season, st.team));
      $(`compare-${side}-title`).textContent = DATA.teams[st.season][st.team].name;
      $(`compare-${side}-caption`).textContent = `${st.season} · ${C.mode === "playoffs" ? "playoff top " + M.rotation_size : "regular season"}`;
      drawSquare($(`compare-${side}-svg`), res, { colors, outline: $("compare-outline").checked });
      out[side] = res;
    }
    const A = `${C.a.team} ${yy(C.a.season)}`;
    const B = `${C.b.team} ${yy(C.b.season)}`;
    const lead = (va, vb, higher) => (higher == null || va === vb ? ["", ""] : (va > vb) === higher ? ["lead", ""] : ["", "lead"]);
    const row = (name, va, vb, fmt, higher) => {
      const [la, lb] = lead(va, vb, higher);
      return `<tr><th scope="row">${esc(name)}</th><td class="${la}">${fmt(va)}</td><td class="${lb}">${fmt(vb)}</td></tr>`;
    };
    const rows = [
      row("Coverage", out.a.coverage, out.b.coverage, share, true),
      row("Depth", out.a.depth, out.b.depth, share, true),
      row("Overlap (squares)", out.a.overlap, out.b.overlap, (v) => v.toFixed(2), null),
      ...M.capped.map((c) => row(`Surplus: ${M.labels[c]}`, out.a.redundancyPlayers[c] || 0, out.b.redundancyPlayers[c] || 0, (v) => `+${v.toFixed(1)}`, null)),
    ].join("");
    const dumbs = ORDER.map((c) => {
      const pa = out.a.pct[c] || 0;
      const pb = out.b.pct[c] || 0;
      return `<div><div class="dumb-head"><b>${esc(M.labels[c])}</b><span>${esc(A)} ${fmtPct(pa)} · ${esc(B)} ${fmtPct(pb)}</span></div>
        <div class="dumb-track"><span class="dumb-span" style="left:${Math.min(pa, pb)}%;width:${Math.abs(pa - pb)}%"></span>
        <span class="dumb-dot b" style="left:${pb}%"></span><span class="dumb-dot" style="left:${pa}%"></span></div></div>`;
    }).join("");
    $("compare-versus").innerHTML = `
      <div class="table-wrap"><table><thead><tr><th scope="col"></th><th scope="col">${esc(A)}</th><th scope="col">${esc(B)}</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="card"><div class="chart-title"><h2 style="font-size:20px">Depth by corner</h2>
        <span class="legend-ab"><span><i class="a"></i>${esc(A)}</span><span><i></i>${esc(B)}</span></span></div>
        <div class="dumbbells">${dumbs}</div>
        <p class="muted" style="margin:10px 0 0;font-size:13px">Team percentile vs ${poolSize(C.mode)} team-seasons; 0 to 100 left to right.</p></div>`;
    store.set("rf-compare", JSON.stringify(C));
  }

  /* ---- Builder ---------------------------------------------------------------------------- */
  const SEARCH = [];
  for (const s of SEASONS) {
    for (const p of INDEX[s].values()) {
      if (p.pct.every((v) => v != null) && p.min >= 200) SEARCH.push({ ...p, key: norm(p.name) });
    }
  }
  let lineup = [];
  const pick = (k) => { const [pid, season] = k.split("|"); return INDEX[season].get(Number(pid)); };

  function renderBuilder() {
    fillSelect($("builder-season"), seasonItems(), $("builder-season").value || LATEST);
    fillSelect($("builder-team"), teamItems($("builder-season").value), $("builder-team").value);
    const players = lineup.map(pick).filter(Boolean);
    const slotsEl = $("builder-slots");
    const items = [];
    for (let i = 0; i < 5; i++) {
      const p = players[i];
      if (!p) { items.push(`<li class="slot empty"><span></span><span class="who">Open spot</span><span></span></li>`); continue; }
      const corners = ORDER.map((c) => `${short(c)} ${fmtPct(p.pct[CIDX[c]])}`).join(" · ");
      items.push(`<li class="slot"><span class="swatch c${i + 1}" style="background:var(--c);margin:0"></span>
        <span class="who"><b>${esc(p.name)}</b><span>${esc(p.team)} ${esc(p.season)} · ${corners}</span></span>
        <button class="x" data-remove="${i}" aria-label="Remove ${esc(p.name)}">×</button></li>`);
    }
    slotsEl.innerHTML = items.join("");
    const res = RF.evaluateLineup(DATA, INDEX, players.map((p) => ({ season: p.season, pid: p.pid })));
    const slots = new Map(players.map((p, i) => [keyOf(p), i]));
    const colors = { colored: res.players, others: [], slots };
    $("builder-caption").textContent = `${players.length} of 5 picked`;
    drawSquare($("builder-svg"), res, { colors, outline: true, labelOf: (p) => `${p.name} ’${p.season.slice(5)}` });
    $("builder-panel").innerHTML = statsHTML(res, "regular", "five starters, compared with real teams")
      + tableHTML(res, colors, { second: "Season", secondValue: (p) => esc(p.season) });
    const byKey = new Map(res.players.map((p) => [keyOf(p), p]));
    bindFocus($("builder-svg"), $("builder-panel"), $("builder-hint"), (k) => describePlayer(byKey.get(k)));
    store.set("rf-lineup", JSON.stringify(lineup));
    renderResults();
  }

  function renderResults() {
    const q = norm($("builder-search").value);
    const list = $("builder-results");
    if (!q) { list.innerHTML = ""; return; }
    const words = q.split(" ");
    const hits = SEARCH.filter((p) => words.every((w) => p.key.includes(w)))
      .sort((a, b) => (b.key.startsWith(q) - a.key.startsWith(q)) || b.season.localeCompare(a.season) || b.min - a.min)
      .slice(0, 14);
    if (!hits.length) { list.innerHTML = `<li class="muted" style="padding:6px 8px">No player with 200+ minutes matches "${esc($("builder-search").value)}".</li>`; return; }
    const full = lineup.length >= 5;
    list.innerHTML = hits.map((p) => {
      const k = keyOf(p);
      const taken = lineup.includes(k);
      const corners = ORDER.map((c) => fmtPct(p.pct[CIDX[c]])).join(" / ");
      return `<li class="result"><span><b>${esc(p.name)}</b> <span class="meta">${esc(p.team)} ${esc(p.season)} · ${mins(p.min)} min</span><br>
        <span class="meta pcts">${ORDER.map((c) => esc(short(c))).join(" / ")}: ${corners}</span></span>
        <button class="btn${taken || full ? "" : " primary"}" data-add="${esc(k)}" ${taken || full ? "disabled" : ""}>${taken ? "Added" : full ? "Full" : "Add"}</button></li>`;
    }).join("");
  }

  function loadTeamTop5(season, abbr) {
    const pairs = (DATA.teams[season][abbr].regular || []);
    lineup = pairs.map(([pid]) => INDEX[season].get(pid))
      .filter((p) => p && p.pct.every((v) => v != null)).slice(0, 5).map(keyOf);
  }

  /* ---- tabs, events, start ---------------------------------------------------------------- */
  const VIEWS = ["teams", "compare", "builder"];
  function show(view) {
    if (!VIEWS.includes(view)) view = "teams";
    for (const v of VIEWS) {
      $(`view-${v}`).hidden = v !== view;
      $(`tab-${v}`).setAttribute("aria-selected", String(v === view));
    }
    store.set("rf-view", view);
  }
  for (const v of VIEWS) $(`tab-${v}`).addEventListener("click", () => { show(v); history.replaceState(null, "", `#${v}`); });

  $("teams-season").addEventListener("change", (e) => { T.season = e.target.value; renderTeams(); });
  $("teams-team").addEventListener("change", (e) => { T.team = e.target.value; renderTeams(); });
  $("teams-mode-regular").addEventListener("click", () => { T.mode = "regular"; renderTeams(); });
  $("teams-mode-playoffs").addEventListener("click", () => { T.mode = "playoffs"; renderTeams(); });
  $("teams-outline").addEventListener("change", renderTeams);
  for (const side of ["a", "b"]) {
    $(`compare-${side}-season`).addEventListener("change", (e) => { C[side].season = e.target.value; renderCompare(); });
    $(`compare-${side}-team`).addEventListener("change", (e) => { C[side].team = e.target.value; renderCompare(); });
  }
  $("compare-mode-regular").addEventListener("click", () => { C.mode = "regular"; renderCompare(); });
  $("compare-mode-playoffs").addEventListener("click", () => { C.mode = "playoffs"; renderCompare(); });
  $("compare-outline").addEventListener("change", renderCompare);
  $("builder-search").addEventListener("input", renderResults);
  $("builder-results").addEventListener("click", (e) => {
    const b = e.target.closest("[data-add]");
    if (!b || lineup.length >= 5 || lineup.includes(b.dataset.add)) return;
    lineup.push(b.dataset.add);
    renderBuilder();
  });
  $("builder-slots").addEventListener("click", (e) => {
    const b = e.target.closest("[data-remove]");
    if (!b) return;
    lineup.splice(Number(b.dataset.remove), 1);
    renderBuilder();
  });
  $("builder-season").addEventListener("change", () => renderBuilder());
  $("builder-load").addEventListener("click", () => { loadTeamTop5($("builder-season").value, $("builder-team").value); renderBuilder(); });
  $("builder-clear").addEventListener("click", () => { lineup = []; renderBuilder(); });

  // glossary + sources
  const gloss = [
    ["Corners", ORDER.map((c) => `${M.labels[c]} (${M.descriptions[c]})`).join("; ") + "."],
    ["Player shape", `Each corner is the player's percentile among qualified players that season (${M.min_gp}+ games, ${M.min_mpg}+ minutes a game). On team charts, a shape's area grows with minutes played.`],
    ["Coverage", "How much of the square the players' shapes fill together: does anyone on the team cover each part of it?"],
    ["Depth", "The black outline: how much of each corner the whole rotation provides, weighted by minutes and ranked against every team-season in the data."],
    ["Overlap", "Shape area that two or more players share. Big overlap means players doing the same job."],
    ["Surplus above cap", "In Sets up others and Fits next to stars, more stops counting once a team is in the top 20%. The extra is shown in players' worth."],
  ];
  $("glossary").innerHTML = gloss.map(([t, d]) => `<dt>${esc(t)}</dt><dd>${esc(d)}</dd>`).join("");
  $("sources").innerHTML = `Data: player stats from <a href="https://www.nba.com/stats" target="_blank" rel="noopener">NBA.com</a> via nba_api; offense and defense from <a href="https://www.darko.app" target="_blank" rel="noopener">DARKO</a>. Seasons ${esc(SEASONS[0])} to ${esc(LATEST)}, built ${esc(M.generated)}. A personal project, not affiliated with the NBA.`;
  $("brand-sub").textContent = `${SEASONS[0]} to ${LATEST}`;
  $("synthetic-notice").hidden = !M.synthetic;

  // restore the viewer's last state where it still exists
  try {
    const t = JSON.parse(store.get("rf-teams") || "null");
    if (t && DATA.teams[t.season] && DATA.teams[t.season][t.team]) Object.assign(T, t);
  } catch (e) { /* ignore */ }
  if (!T.team) T.team = defaultTeam(T.season, ["NYK"]);
  try {
    const c = JSON.parse(store.get("rf-compare") || "null");
    if (c && ["a", "b"].every((s) => DATA.teams[c[s].season] && DATA.teams[c[s].season][c[s].team])) Object.assign(C, c);
  } catch (e) { /* ignore */ }
  if (!C.a.team) C.a.team = defaultTeam(LATEST, ["NYK"]);
  if (!C.b.team) C.b.team = defaultTeam(LATEST, ["SAS", teamsIn(LATEST)[1] && teamsIn(LATEST)[1].abbr]);
  try {
    const l = JSON.parse(store.get("rf-lineup") || "null");
    if (Array.isArray(l)) lineup = l.filter((k) => pick(k)).slice(0, 5);
  } catch (e) { /* ignore */ }
  if (!lineup.length) loadTeamTop5(LATEST, T.team);
  fillSelect($("builder-season"), seasonItems(), LATEST);
  fillSelect($("builder-team"), teamItems(LATEST), T.team);

  renderTeams();
  renderCompare();
  renderBuilder();
  const fromHash = location.hash.replace("#", "");
  show(VIEWS.includes(fromHash) ? fromHash : store.get("rf-view") || "teams");
})();
</script>
