# Roster-fit configuration. Every weight, cap, threshold and metric choice lives here.
# Unknown keys are rejected, so a typo fails loudly instead of being ignored.
#
# To change settings for yourself, put just the keys you change in config.local.yaml next to
# this file (same layout). It is applied on top of this one and git pull never touches it.

seasons:
  target: "2025-26"                  # default season for `plot`
  window: ["2017-18", "2025-26"]     # team-percentile pool: every team-season in this range
                                     # (2017-18 is the first season with NBA.com matchup data)

qualified:                           # the league-wide pool that player percentiles and z-scores use
  min_gp: 25
  min_mpg: 15.0

corners:
  # Clockwise from top-left: TL, TR, BR, BL. Only neighboring corners multiply in a shape's area:
  # area = (sum of one opposite pair) x (sum of the other) / 4.
  order: [offense, playmaking, portability, defense]
  labels:
    offense: "Offense"                 # O-LEBRON and O-DARKO measure all of offense, not just scoring
    playmaking: "Sets up others"
    portability: "Fits next to stars"
    defense: "Stops"
  descriptions:
    offense: "O-LEBRON 80% + O-DARKO 20%"
    playmaking: "Potential AST + AST pts created / 100"
    portability: "3PT spacing 40%, screens + OREB 40%, versatility 20%"
    defense: "D-LEBRON 80% + D-DARKO 20%"

impact:                              # offense and defense corners: blends of plus-minus metrics
  # Each source is z-scored within the season's qualified players, then averaged with these
  # weights (the 2 : 0.5 ratio follows Crafted NBA's defensive blend). A player missing a source
  # gets the average of the ones he has; a season missing a weighted source's CSV is left out of
  # the team pool. A corner left out here uses the main source (source_name) alone.
  weights:
    offense: {LEBRON: 2.0, DARKO: 0.5}
    defense: {LEBRON: 2.0, DARKO: 0.5}
  min_weight_present: 0.2            # share of the weight a player needs (0.2 = DARKO alone is enough)

  # The main source:
  source_name: "DARKO"
  url: "https://www.darko.app"
  dir: "data/manual/darko"           # CSVs you download yourself from darko.app (no scraping)
  # Column aliases, matched after lower-casing and turning punctuation/spaces into "_".
  columns:
    player_id: ["nba_id", "nbaid", "player_id", "playerid", "nba_player_id", "id"]
    player_name: ["player_name", "player", "name", "full_name"]
    offense: ["o_dpm", "odpm", "offensive_dpm", "off_dpm", "o_darko", "offense"]
    defense: ["d_dpm", "ddpm", "defensive_dpm", "def_dpm", "d_darko", "defense"]
    season: ["season", "season_id", "year"]
    date: ["date", "game_date", "as_of", "asof"]
  numeric_season_is_end_year: true   # a season column of 2026 means 2025-26
  defense_higher_is_better: true
  # Optional extra smoothing of defense across seasons (DARKO already decays past seasons,
  # so this is off by default). Weights apply to seasons t, t-1, t-2.
  defense_multi_year:
    enabled: false
    weights: [0.6, 0.3, 0.1]
  # For names `rosterfit check` reports as unmatched: "Name In The CSV": "Name On NBA.com" (or player id)
  name_overrides: {}

  extra_sources:
    LEBRON:                          # BBall Index's LEBRON database, saved with its CSV button
      url: "https://www.bball-index.com/"
      dir: "data/manual/lebron"      # one file per season, e.g. lebron-data-2026.csv (2026 = 2025-26)
      columns:
        player_id: ["nba_id"]
        player_name: ["player"]
        offense: ["o_lebron"]
        defense: ["d_lebron"]
        season: ["season"]
        off_role: ["offrole", "off_role"]
        def_role: ["defrole", "def_role"]
        position: ["pos", "position"]     # PG/SG/SF/PF/C: the cap game's position rounds
      numeric_season_is_end_year: true
      defense_higher_is_better: true
      name_overrides: {}

playmaking:                          # creating for teammates; self-scoring belongs in offense
  weights:                           # each component is z-scored within the qualified pool first
    potential_ast_per100: 0.5
    ast_pts_created_per100: 0.5
    turnovers_per100: 0.0            # counted as a negative when > 0
    box_creation: 0.0                # Ben Taylor's Box Creation; includes a scorer-gravity term
  min_weight_present: 0.5            # need at least this share of the weight to score a player
  component_scaling: "z"             # z: mean/SD z-scores; rank: rank-based z-scores (an outlier stat can't dominate)

portability:                         # value kept without the ball
  # Three parts, added up. Each part is standardized among the season's qualified players and a
  # below-average part counts 0, so a pure shooter isn't dragged down by his rebounding, a pure
  # rim-runner isn't dragged down by his shooting, and a shooting big earns both.
  combine: "parts"
  parts:
    spacing:                         # all 3s, a catch-and-shoot 3 counting catch_shoot_weight times
      weight: 0.4
      components: {three_volume: 0.7, three_accuracy: 0.3}   # volume = gravity, accuracy = punishment
    screening:
      weight: 0.4
      components: {oreb_pct: 0.5, screen_ast_per100: 0.5}
    versatility:                     # spread of matchup time across guards / forwards / centers
      weight: 0.2
      components: {versatility: 1.0}
  catch_shoot_weight: 1.5            # off-ball catch-and-shoot 3s count 1.5x pull-up and other 3s
  # combine: "mean" uses these weights instead (the older formula, catch-and-shoot 3s only):
  weights:
    cs3_proficiency: 0.25            # Taylor's 3-pt proficiency curve on catch-and-shoot 3s
    oreb_pct: 0.25
    screen_ast_per100: 0.25
    versatility: 0.25
  min_weight_present: 0.5
  component_scaling: "rank"          # z or rank; rank keeps a center's OREB% from swamping the rest
  cs3_pct_prior_attempts: 50         # shrink 3P% toward league average by this many attempts
  versatility_min_partial_poss: 300  # fewer matchup possessions than this -> no versatility score

skills:                              # the 3D view: six skills on three axes
  # Each pair is one axis: its two ends are substitutes (being great at either fills the axis), and
  # a shape's volume is the product of the three axis sums, so a player needs something on every
  # axis. Each component is ranked among the season's qualified players; a skill is the weighted
  # mean of its components, shown as a percentile. Shape size comes from overall impact (LEBRON +
  # DARKO, offense plus defense): size = size_floor + (1 - size_floor) x impact percentile / 100.
  enabled: true
  pairs:                             # [one end, the opposite end]
    - [creation, playmaking]
    - [spacing, screening]
    - [perimeter_defense, rim_protection]
  labels:
    creation: "Creates his shot"
    playmaking: "Sets up others"
    spacing: "Spaces the floor"
    screening: "Screens & crashes"
    perimeter_defense: "Perimeter D"
    rim_protection: "Protects the rim"
  axes:
    creation: {unassisted_fgm_per100: 0.5, drives_per100: 0.3, fta_per100: 0.2}
    playmaking: {potential_ast_per100: 0.5, ast_pts_created_per100: 0.5}
    spacing: {three_volume: 0.7, three_accuracy: 0.3}          # same as "Fits next to stars"
    screening: {oreb_pct: 0.5, screen_ast_per100: 0.5}
    # who he guarded (matchup_difficulty) plus activity; steals and deflections alone reward gambling
    perimeter_defense: {matchup_difficulty: 0.4, deflections_per100: 0.25, contested3_per100: 0.2, stl_per100: 0.15}
    rim_protection: {rim_points_saved_per100: 0.5, rim_contests_per100: 0.2, blk_per100: 0.3}
  min_weight_present: 0.5
  size_floor: 0.35
  # matchup_difficulty: the possession-weighted average of the players he guarded, rated by their
  # "creation" percentile (self-creators: the perimeter threats) or "offense" (LEBRON + DARKO
  # offense, which also rewards guarding star bigs). Pulled toward average by matchup_prior_poss.
  matchup_quality: creation
  matchup_prior_poss: 200

team:
  on_court_slots: 5                  # minutes weights sum to 5; a 48-minute player counts 1.0
  capped_corners: [playmaking, portability]
  floor_negative_corners: [playmaking, portability]  # below-average players add 0, not a negative
  # How the cap on capped corners is set:
  #   pool_percentile: the corner is full once a team reaches this percentile of all team-seasons
  #                    in the window. Always binds for the same share of teams.
  #   players_worth:   cap = cap_players_worth x one player's worth. With the zero floor above,
  #                    1.75 sits below the median team (binds for ~3/4 of teams in testing).
  cap_mode: "pool_percentile"
  cap_pool_percentile: 80
  cap_players_worth: 1.75
  cap_reference_percentile: 85       # one "player's worth" = this percentile player ...
  cap_reference_mpg: 34              # ... at these minutes per game (also the unit for redundancy)
  missing_value_z: 0.0               # z used for a player with no data in an uncapped corner

playoffs:
  rotation_size: 8                   # top N by playoff minutes; metrics still come from the regular season

drawing:
  theme: "light"                     # light | dark
  # How far along the diagonal a percentile reaches. rank: the best player in a corner reaches it and
  # every time the rank halves (20th -> 10th -> 5th) the vertex moves the same step outward (4th-best
  # 76% of the way, 20th-best 48%, median 12%), so the top of the league stands apart. percentile: pct / 100.
  scale: "rank"
  minutes_scaling: "area"            # area: shape area proportional to minutes vs the team's leader; none
  team_outline: true                 # draw the black team outline (depth); --no-outline hides it
  min_minutes_to_draw: 100
  max_colored_players: 8             # the rest are drawn in gray as "Other"
  fill_alpha: 0.16
  dpi: 200

fetch:
  cache_dir: "data/cache"
  manual_dir: "data/manual/nba"      # NBA.com responses saved by hand; copied into the cache on every run
  sleep_seconds: 1.0                 # pause between NBA.com requests
  timeout: 60
  retries: 3
